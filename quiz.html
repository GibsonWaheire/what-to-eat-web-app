<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quiz - What Should I Eat?</title>
  <link rel="stylesheet" href="./css/quiz.css">
</head>
<body>
  <div class="header">
    <div class="container">
      <div class="nav-wrapper">
        <nav>
          <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="quiz.html">Quiz</a></li>
            <li><a href="results.html">Result</a></li>
          </ul>
        </nav>
      </div>
    </div>
  </div>

  <div class="main-content">
    <div class="container">
      <h2>Tell Us About Your Recent Habits</h2>
      <form id="meal-quiz">
        <div class="form-group">
          <label for="yesterday">Yesterday's main meal:</label>
          <select id="yesterday" name="yesterday" required>
            <option value="" disabled selected>Select an option</option>
            <option value="heavy">Heavy (ugali + beef, fried chicken, Mukimo, Omena,fish etc )</option>
            <option value="light">Light (vegetables, rice, indomil, soup)</option>
            <option value="skipped">I skipped meal</option>
          </select>
        </div>

        <div class="form-group">
          <p>Vegetables eaten in last 3 days?</p>
          <label><input type="radio" name="vegetables" value="yes" required> Yes</label>
          <label><input type="radio" name="vegetables" value="no"> No</label>
        </div>

        <div class="form-group">
          <p>Ate fried food recently?</p>
          <label><input type="radio" name="fried" value="yes" required> Yes</label>
          <label><input type="radio" name="fried" value="no"> No</label>
        </div>

        <div class="form-group">
          <label for="activity">Physical activity level:</label>
          <select id="activity" name="activity" required>
            <option value="" disabled selected>Select an option</option>
            <option value="low">Low</option>
            <option value="medium">Medium</option>
            <option value="high">High</option>
          </select>
        </div>

        <div class="form-group">
          <p>Feeling hungry now?</p>
          <label><input type="radio" name="hungry" value="yes" required> Yes</label>
          <label><input type="radio" name="hungry" value="no"> No</label>
        </div>

        <div class="btn-container">
          <button type="submit" class="btn">Get Suggestion</button>
        </div>
      </form>
    </div>
  </div>

  <div class="footer">
    <div class="container">
      <p>&copy; 2025 What Should I Eat?</p>
    </div>
  </div>

  <script src="./src/script.js"></script>
</body>
</html>
